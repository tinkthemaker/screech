name: ci

# release.yml only fires on tags, so without this nothing checks ordinary
# pushes. The gates are cheap; run them on every change instead of finding
# out at tag time.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: Module tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      # Pinned, not latest: the tool must understand the go.mod language
      # version, and a release that predates it fails opaque.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      # Windows and macOS are the platforms screech actually ships to, and
      # the IPC layer is build-tagged per OS. Compiling them here catches a
      # broken named-pipe path without waiting for a release.
      - name: Cross-compile check
        run: |
          set -euo pipefail
          for target in windows/amd64 darwin/arm64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  # Cross-compiling proves the per-OS files build; only running them proves
  # the named pipe, %AppData% config resolution, and console-hold behave.
  # The suite takes seconds, so both shipping platforms run it for real.
  # The race detector needs cgo, which is not guaranteed on the Windows
  # runner; the ubuntu job above owns that gate.
  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
